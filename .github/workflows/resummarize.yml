name: 要約の作り直し（本文から）

on:
  schedule:
    # Gemini の無料枠が戻った後（日本時間 16:37）。まだ要約を作り直していない記事だけを続きから処理する
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      ticker:
        description: '対象のティッカー。カンマ区切りで複数可（空欄なら全社）'
        required: false
        default: ''

concurrency:
  group: news-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regroup:
    # データは main に push するので、他のブランチから実行してもコードを main に混ぜない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: 要約の作り直し
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKER: ${{ inputs.ticker }}
        run: |
          args=(--resummarize)
          if [ -n "$TICKER" ]; then args+=(--ticker "$TICKER"); fi
          python -m collector.main "${args[@]}"
      - name: データのコミットと push
        if: always()
        run: bash scripts/commit-data.sh "Rewrite summaries from article bodies"
